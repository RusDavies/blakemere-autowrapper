name: Publish to TestPyPI

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to publish, e.g. v0.1.2"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    name: Build and publish distribution to TestPyPI
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # actions/checkout v6
        with:
          ref: ${{ github.event.inputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # actions/setup-python v6
        with:
          python-version: "3.12"

      - name: Install build frontend
        run: python -m pip install --upgrade build

      - name: Build source and wheel distributions
        run: python -m build

      - name: Publish to TestPyPI
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # pypa/gh-action-pypi-publish release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
