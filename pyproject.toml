[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "blakemere-autowrapper"
version = "0.1.1"
description = "Lightweight method proxy/wrapper helper with pre, post, and exception hooks."
readme = "README.md"
requires-python = ">=3.8"
license = "MIT"
license-files = ["LICENSE"]
authors = [
  {name = "Russ Davies"}
]
keywords = ["wrapper", "proxy", "decorator", "hooks", "instrumentation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.setuptools]
py-modules = ["AutoWrapper", "autowrapper"]


[project.urls]
Homepage = "https://github.com/RusDavies/blakemere-autowrapper"
Repository = "https://github.com/RusDavies/blakemere-autowrapper"
Issues = "https://github.com/RusDavies/blakemere-autowrapper/issues"
Changelog = "https://github.com/RusDavies/blakemere-autowrapper/releases"
